# Where Zenith's server is, and the Google sign-in client ID that goes with it.
#
# Neither is a secret: both are inside every copy of the app. They are kept here, in the repo, so
# that every machine builds the same app.
#
# Leave them empty and the app has no server: no Account page, no cloud backup, Aura codes as they
# were before, and nothing is ever sent anywhere.
#
#   url             the address from the ZENITH SERVER REPORT, e.g. https://zenith.example.com
#   googleClientId  the "Web application" OAuth client ID, ending in .apps.googleusercontent.com
url=https://zenithlabz.duckdns.org
googleClientId=
